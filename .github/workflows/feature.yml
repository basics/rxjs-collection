name: Feature

on:
  push:
    branches:
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Install
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: lint
        run: npm run lint

      - name: vitest - test & coverage
        run: npm run coverage

      - name: archive vitest code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: vitest-code-coverage-report
          path: ./coverage/

  sonarcloud:
    name: SonarCloud
    needs: install
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: download vitest code coverage results
        uses: actions/download-artifact@v4
        with:
          name: vitest-code-coverage-report
          path: ./coverage/

      - name: SonarCloud (SonarQube) Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Zum Abruf von PR-Daten etc.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
